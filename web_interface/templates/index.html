<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sanskrit NLP</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      #graph-container { display: flex; }
      #graph { width: 70%; }
      #info-panel { width: 30%; padding-left: 20px; }
      .node { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
      .link { stroke: #999; stroke-opacity: 0.6; }
      .tooltip {
        position: absolute;
        text-align: center;
        width: 120px;
        height: auto;
        padding: 2px;
        font: 12px sans-serif;
        background: lightsteelblue;
        border: 0px;
        border-radius: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sanskrit NLP</h1>
      <p>Enter Sanskrit text below to analyze it and add its entities to the knowledge graph.</p>
      <form method="post">
        <textarea name="text" rows="10" cols="80"></textarea>
        <br>
        <button type="submit">Analyze and Add to Graph</button>
      </form>
      <div class="controls">
        <input type="text" id="search" placeholder="Search for a node...">
        <button id="search-btn">Search</button>
      </div>
      <div id="graph-container">
      <div id="graph-container">
      <div id="graph-container">
        <div id="graph"></div>
        <div id="info-panel"></div>
      </div>
        <div id="info-panel"></div>
      </div>
        <div id="info-panel"></div>
      </div>
      <div class="tooltip" style="opacity:0;"></div>
    </div>
    <script>
      const width = 960;
      const height = 600;
      const color = d3.scaleOrdinal(d3.schemeCategory10);

      const svg = d3.select("#graph").append("svg")
          .attr("width", width)
          .attr("height", height);

      const tooltip = d3.select(".tooltip");

      const simulation = d3.forceSimulation()
          .force("link", d3.forceLink().id(d => d.id).distance(100))
          .force("charge", d3.forceManyBody().strength(-100))
          .force("center", d3.forceCenter(width / 2, height / 2));

      d3.json("/graph_data").then(function(graph) {
        const link = svg.append("g")
            .attr("class", "links")
          .selectAll("line")
          .data(graph.links)
          .enter().append("line")
            .attr("class", "link")
            .style("stroke-width", d => Math.sqrt(d.value));

        const node = svg.append("g")
            .attr("class", "nodes")
          .selectAll("circle")
          .data(graph.nodes)
          .enter().append("circle")
            .attr("class", "node")
            .attr("r", 10)
            .attr("fill", d => color(d.group))
            .on("mouseover", (event, d) => {
              tooltip.transition().duration(200).style("opacity", .9);
              tooltip.html(`ID: ${d.id}<br/>Group: ${d.group}`)
                     .style("left", (event.pageX + 5) + "px")
                     .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", () => {
              tooltip.transition().duration(500).style("opacity", 0);
            })
            .on("click", (event, d) => {
              d3.select("#info-panel").html(`<h3>${d.id}</h3><p>Group: ${d.group}</p>`);
            })
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("title")
            .text(d => d.id);

        simulation
            .nodes(graph.nodes)
            .on("tick", ticked);

        simulation.force("link")
            .links(graph.links);

        function ticked() {
          link
              .attr("x1", d => d.source.x)
              .attr("y1", d => d.source.y)
              .attr("x2", d => d.target.x)
              .attr("y2", d => d.target.y);

          node
              .attr("cx", d => d.x)
              .attr("cy", d => d.y);
        }
      });

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }

      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }

      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }

      d3.select("#search-btn").on("click", function() {
        const searchTerm = d3.select("#search").property("value");
        node.style("opacity", d => d.id.includes(searchTerm) ? 1 : 0.1);
        link.style("opacity", d => d.source.id.includes(searchTerm) || d.target.id.includes(searchTerm) ? 1 : 0.1);
      });
    </script>
  </body>
</html>
